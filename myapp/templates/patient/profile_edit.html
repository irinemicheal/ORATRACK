{% extends 'patient/header.html' %}
{% load static %}
{% block content %}

<!-- Page Header Start -->
<div class="container-fluid bg-primary py-5 mb-5">
  <div class="container text-center text-white">
    <i class="bi bi-chat-square-text display-1 mb-3"></i>
    <h1 class="display-4 fw-bold mb-2">Profile</h1>
    <p class="lead fs-5">
      Update your Profile
    </p>
    <hr class="mx-auto" style="width: 80px; border-width: 3px; border-color: rgba(255,255,255,0.7);">
  </div>
</div>
<!-- Page Header End -->

<div class="container" style="max-width: 1050px; min-height: 200px;">
<div class="row"><div class="col-md-12">
  <!-- Messages -->
  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }} alert-dismissible fade show shadow-sm">
        <i class="bi bi-info-circle me-2"></i>
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endif %}

  <!-- Feedback Form -->
  <div class="card shadow rounded-4 mb-5 border-0">
    <div class="card-body p-4">
      <h5 class="fw-bold text-primary mb-3">
        <i class="bi bi-pencil-square me-2"></i>Profile Edit
      </h5>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="row g-3">

        <div class="col-md-6">
            <label class="form-label">Name</label>
            <input type="text" name="name"
                   value="{{ patient.name }}"
                   class="form-control" required>
        </div>

        <div class="col-md-6">
            <label class="form-label">Age</label>
            <input type="number" name="age"
                   value="{{ patient.age }}"
                   class="form-control" required>
        </div>

        <div class="col-md-6">
            <label class="form-label">Gender</label>
            <select name="gender" class="form-select" required>
                <option value="Male"
                    {% if patient.gender == "Male" %}selected{% endif %}>
                    Male
                </option>
                <option value="Female"
                    {% if patient.gender == "Female" %}selected{% endif %}>
                    Female
                </option>
                <option value="Other"
                    {% if patient.gender == "Other" %}selected{% endif %}>
                    Other
                </option>
            </select>
        </div>

        <div class="col-md-6">
            <label class="form-label">Phone</label>
            <input type="text" name="phone"
                   value="{{ patient.phone }}"
                   class="form-control" required>
        </div>

        <div class="col-md-6">
            <label class="form-label">Email</label>
            <input type="email" name="email"
                   value="{{ patient.email }}"
                   class="form-control" required>
        </div>

        <div class="col-md-6">
            <label class="form-label">Address</label>
            <textarea name="address"
                      class="form-control"
                      rows="2"
                      required>{{ patient.address }}</textarea>
        </div>

        <div class="col-md-6">
            <label class="form-label">Profile Image</label><br>

            {% if patient.image %}
                <img src="{{ patient.image.url }}"
                     width="80"
                     class="rounded-circle mb-2">
            {% endif %}

            <input type="file" name="image" class="form-control">
        </div>

    </div>

    <div class="mt-4">
        <button type="submit" class="btn btn-success">
            <i class="bi bi-check-circle"></i> Update Profile
        </button>
    </div>

</form>
    
    </div>
  </div>
</div>
</div></div>
<!-- Simple Validation -->
<script>
  (function () {
    const form = document.getElementById('feedbackForm');
    const input = document.getElementById('feedbackInput');

    form.addEventListener('submit', function (e) {
      if (!input.value.trim()) {
        e.preventDefault();
        input.classList.add('is-invalid');
      } else {
        input.classList.remove('is-invalid');
      }
    });
  })();
</script>

{% endblock %}
