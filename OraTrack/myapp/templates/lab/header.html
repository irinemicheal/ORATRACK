{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OraTrack | Lab Panel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f5f7fa;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            height: 100vh;
            position: fixed;
            background: linear-gradient(180deg, #198754, #20c997);
            color: #fff;
            padding-top: 20px;
        }

        .sidebar .brand {
            text-align: center;
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 30px;
        }

        .sidebar a {
            display: block;
            padding: 12px 20px;
            color: #fff;
            text-decoration: none;
            border-radius: 10px;
            margin: 5px 15px;
            transition: 0.3s;
        }

        .sidebar a i {
            margin-right: 10px;
        }

        .sidebar a:hover {
            background: rgba(255,255,255,0.2);
        }

        /* Main content */
        .main-content {
            margin-left: 260px;
            padding: 20px;
        }

        /* Topbar */
        .topbar {
            background: #fff;
            padding: 15px 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .card {
            border-radius: 15px;
            border: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        footer {
            text-align: center;
            color: #777;
            margin-top: 40px;
        }
    </style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <div class="brand">
        <i class="bi bi-flask2-fill"></i> OraTrack
        <p style="font-size:12px;">Lab Panel</p>
    </div>

    <a href="{% url 'lab_home' %}">
        <i class="bi bi-speedometer2"></i> Dashboard
    </a>

    <a href="{% url 'lab_add_and_view_tests' %}">
        <i class="bi bi-clipboard2-pulse"></i> Add Lab Test
    </a>
 <a href="{% url 'pending_tests' %}">
        <i class="bi bi-file-earmark-medical"></i>New Test
    </a>
    <a href="{% url 'upload_reports' %}">
        <i class="bi bi-file-earmark-medical"></i>Processing Test
    </a>

    <a href="{% url 'test_history' %}">
        <i class="bi bi-archive"></i> Test History
    </a>

    <a href="{% url 'common_logout' %}">
        <i class="bi bi-box-arrow-right"></i> Logout
    </a>
</div>

<!-- MAIN CONTENT -->
<div class="main-content">

    <!-- TOPBAR -->
    <div class="topbar d-flex justify-content-between align-items-center">
        <h5 class="mb-0">Welcome, Lab Team 🧪</h5>
        <span class="text-muted">OraTrack | Biopsy & Oncology Labs</span>
    </div>

    {% block content %}
    {% endblock %}

    <footer>
        © 2026 <strong>OraTrack</strong> | Lab Panel
    </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
