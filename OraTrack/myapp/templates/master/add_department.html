{% extends 'master/header.html' %}
{% load static %}

{% block content %}
<div class="container mt-5">

    <div class="card shadow-sm border-0">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h5 class="mb-0">
                <i class="bi bi-diagram-3"></i> Add Doctor Department
            </h5>

            <a href="{% url 'admin_department_list' %}" class="btn btn-light btn-sm">
                <i class="bi bi-list"></i> Department List
            </a>
        </div>

        <div class="card-body">

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-success alert-dismissible fade show">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}

            <form id="departmentForm" method="post" novalidate>
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        Department Name
                    </label>
                    <input type="text" name="name" id="name" class="form-control"
                           placeholder="e.g. General Dentist" required>
                    <div class="invalid-feedback">
                        Please enter a department name with at least 3 characters.
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">
                        Description
                    </label>
                    <textarea name="description" class="form-control" rows="3"
                              placeholder="Brief description of the department"></textarea>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-plus-circle"></i> Add Department
                    </button>

                    <a href="{% url 'admin_home' %}" class="btn btn-outline-secondary">
                        Cancel
                    </a>
                </div>
            </form>

        </div>
    </div>

</div>

<script>
  (function() {
    'use strict';

    const form = document.getElementById('departmentForm');
    const nameInput = document.getElementById('name');

    form.addEventListener('submit', function(event) {
      let valid = true;

      const nameVal = nameInput.value.trim();
      if (nameVal.length < 3) {
        nameInput.classList.add('is-invalid');
        valid = false;
      } else {
        nameInput.classList.remove('is-invalid');
      }

      if (!valid) {
        event.preventDefault();
        event.stopPropagation();
      }
    });
  })();
</script>

{% endblock %}
