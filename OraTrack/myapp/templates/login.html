{% extends 'header.html' %}
{% load static %}

{% block content %}


<!-- Page Header Start -->
    <div class="container-fluid page-header py-5 mb-5 wow fadeIn" data-wow-delay="0.1s">
        <div class="container text-center py-5 mt-4">
            <h1 class="display-2 text-white mb-3 animated slideInDown"> Login</h1>
            <nav aria-label="breadcrumb animated slideInDown">
                
            </nav>
        </div>
    </div>
    <!-- Page Header End -->

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">

            <div class="card shadow-lg border-0 rounded-4 mb-5">
                <div class="card-header text-center bg-primary text-white rounded-top-4 py-3">
                    <h4 class="mb-0">
                        <i class="fa fa-sign-in-alt me-2"></i>
                         Login
                    </h4>
                </div>

                <div class="card-body p-4">

                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-danger text-center">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}

                    <form method="POST" action="{% url 'login_action' %}">
                        {% csrf_token %}

                        <!-- Username -->
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fa fa-user"></i>
                                </span>
                                <input type="text" name="username" class="form-control" required>
                            </div>
                        </div>

                        <!-- Password -->
                        <div class="mb-4">
                            <label class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fa fa-lock"></i>
                                </span>
                                <input type="password" name="password" class="form-control" required>
                            </div>
                        </div>

                        <!-- Button -->
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg rounded-pill">
                                Login
                            </button>
                        </div>

                    </form>

                </div>

                <div class="card-footer text-center bg-light">
                    <small>
                        Don’t have an account?
                        <a href="{% url 'patient_registration' %}" class="text-primary fw-bold">Register</a>
                    </small>
                </div>

            </div>

        </div>
    </div>
</div>

{% endblock content %}
